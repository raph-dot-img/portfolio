<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20" width="100" height="20">
  <!-- Boutons Réduire / Agrandir / Fermer d'une fenêtre Windows 7, purement
       décoratifs (pseudo-élément sans texte, ignoré des lecteurs d'écran). -->
  <defs>
    <linearGradient id="verre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="rouge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeb0a0"/>
      <stop offset=".48" stop-color="#dd8770"/>
      <stop offset=".5" stop-color="#c8432a"/>
      <stop offset="1" stop-color="#e0745a"/>
    </linearGradient>
    <clipPath id="groupe">
      <path d="M.5,-1 H99.5 V15.5 a4,4 0 0 1 -4,4 H4.5 a4,4 0 0 1 -4,-4 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#groupe)">
    <rect x="0" y="-1" width="53" height="22" fill="#5b7b9c" fill-opacity=".35"/>
    <rect x="0" y="-1" width="53" height="22" fill="url(#verre)"/>
    <rect x="53" y="-1" width="47" height="22" fill="url(#rouge)"/>
    <!-- Liserés clairs à l'intérieur de chaque bouton -->
    <path d="M1.5,0 V15.5 a3,3 0 0 0 3,3 H25.5 V0 M27.5,0 V18.5 H51.5 V0 M53.5,0 V18.5 H95.5 a3,3 0 0 0 3,-3 V0" fill="none" stroke="#fff" stroke-opacity=".55"/>
  </g>
  <!-- Contour du groupe et séparations -->
  <path d="M.5,-1 V15.5 a4,4 0 0 0 4,4 H95.5 a4,4 0 0 0 4,-4 V-1 M26.5,0 V19.5 M52.5,0 V19.5" fill="none" stroke="#000" stroke-opacity=".55"/>
  <!-- Pictogrammes : blancs avec un contour sombre, comme sous Windows 7 -->
  <g fill="#fff" stroke="#1d2b3a" stroke-opacity=".8" stroke-width="1">
    <rect x="8.5" y="11.5" width="10" height="3" rx=".5"/>
    <path d="M34.5,4.5 H45.5 V14.5 H34.5 Z M37.5,8.5 V11.5 H42.5 V8.5 Z" fill-rule="evenodd"/>
    <path d="M71,4.5 L76.5,9 82,4.5 84,6.5 79,10.5 84,14.5 82,16.5 76.5,12 71,16.5 69,14.5 74,10.5 69,6.5 Z"/>
  </g>
</svg>
