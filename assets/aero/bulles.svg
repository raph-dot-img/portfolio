<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="480" height="720">
  <!-- Motif de bulles, répété et animé vers le haut par style.css.
       Aucune bulle ne touche les bords : le motif se raccorde sans couture. -->
  <defs>
    <radialGradient id="corps" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".7" stop-color="#e8f8ff" stop-opacity=".08"/>
      <stop offset=".92" stop-color="#bfeaff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="eclat" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="b">
      <circle r="50" fill="url(#corps)"/>
      <circle r="49.5" fill="none" stroke="#fff" stroke-opacity=".45"/>
      <ellipse cx="-20" cy="-24" rx="18" ry="10" transform="rotate(-35 -20 -24)" fill="url(#eclat)"/>
      <path d="M22,30 A38,38 0 0 0 38,10" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <use href="#b" transform="translate(70 90) scale(.42)"/>
  <use href="#b" transform="translate(300 60) scale(.18)"/>
  <use href="#b" transform="translate(410 200) scale(.6)"/>
  <use href="#b" transform="translate(160 260) scale(.24)"/>
  <use href="#b" transform="translate(60 420) scale(.3)"/>
  <use href="#b" transform="translate(260 470) scale(.5)"/>
  <use href="#b" transform="translate(430 560) scale(.2)"/>
  <use href="#b" transform="translate(130 630) scale(.16)"/>
  <use href="#b" transform="translate(360 370) scale(.12)"/>
</svg>
