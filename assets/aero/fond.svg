<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!-- Fond d'écran du thème Aero : colline verte sous un ciel bleu, clin
       d'œil au fond d'écran de Windows XP. Dessin original, aucune photo
       n'est reprise. Servi en fichier car la CSP refuse les data:. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a35b5"/>
      <stop offset=".35" stop-color="#1560dd"/>
      <stop offset=".6" stop-color="#3d8eef"/>
      <stop offset=".78" stop-color="#86c0f8"/>
    </linearGradient>
    <radialGradient id="halo" cx="380" cy="80" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fc2ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7fc2ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Colline : vert éclairé en haut, plus profond vers le bas -->
    <linearGradient id="colline" x1="0" y1="690" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd12e"/>
      <stop offset=".25" stop-color="#6cb81c"/>
      <stop offset=".7" stop-color="#3f8f0e"/>
      <stop offset="1" stop-color="#2c710a"/>
    </linearGradient>
    <radialGradient id="lumiere" cx="980" cy="760" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9f56a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d9f56a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ombre" cx="120" cy="1120" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#174f05" stop-opacity=".6"/>
      <stop offset="1" stop-color="#174f05" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lointain" x1="0" y1="760" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f6a99"/>
      <stop offset="1" stop-color="#8fa9cf"/>
    </linearGradient>
    <clipPath id="forme-colline">
      <path d="M-20,772 C210,722 480,694 760,690 C1050,686 1340,738 1590,798 C1740,834 1850,856 1940,866 L1940,1100 L-20,1100 Z"/>
    </clipPath>

    <!-- Bords cotonneux des cumulus : le dessin est déformé par un bruit -->
    <filter id="coton" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="4" seed="7" result="bruit"/>
      <feDisplacementMap in="SourceGraphic" in2="bruit" scale="34" xChannelSelector="R" yChannelSelector="G" result="deforme"/>
      <feGaussianBlur in="deforme" stdDeviation="3"/>
    </filter>
    <!-- Cirrus : bruit étiré à l'horizontale, puis flou -->
    <filter id="voile" x="-20%" y="-100%" width="140%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency=".0015 .02" numOctaves="2" seed="3" result="bruit"/>
      <feDisplacementMap in="SourceGraphic" in2="bruit" scale="36" xChannelSelector="R" yChannelSelector="G" result="deforme"/>
      <feGaussianBlur in="deforme" stdDeviation="9 3"/>
    </filter>
    <!-- Rangs d'herbe : stries horizontales très discrètes -->
    <filter id="herbe" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .22" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .08  0 0 0 0 .24  0 0 0 0 .02  1.5 0 0 0 -.6"/>
    </filter>
    <filter id="flou-ombre" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <linearGradient id="dessous-nuage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fc"/>
      <stop offset=".55" stop-color="#c9d8ef"/>
      <stop offset="1" stop-color="#a3badc"/>
    </linearGradient>

    <!-- Trois formes de cumulus : une base ombrée, puis le blanc par-dessus,
         décalé vers le haut, pour le volume -->
    <g id="cumulus-a">
      <g fill="url(#dessous-nuage)">
        <circle cx="0" cy="0" r="52"/><circle cx="64" cy="-34" r="70"/><circle cx="140" cy="-12" r="58"/>
        <circle cx="200" cy="8" r="40"/><circle cx="-56" cy="14" r="36"/><rect x="-92" y="0" width="330" height="48" rx="24"/>
      </g>
      <g fill="#fff">
        <circle cx="-4" cy="-10" r="46"/><circle cx="58" cy="-46" r="62"/><circle cx="134" cy="-24" r="50"/>
        <circle cx="192" cy="-2" r="32"/><circle cx="-56" cy="4" r="28"/>
      </g>
    </g>
    <g id="cumulus-b">
      <g fill="url(#dessous-nuage)">
        <circle cx="0" cy="0" r="38"/><circle cx="48" cy="-22" r="46"/><circle cx="98" cy="-4" r="34"/>
        <rect x="-40" y="0" width="176" height="34" rx="17"/>
      </g>
      <g fill="#fff">
        <circle cx="-2" cy="-8" r="32"/><circle cx="44" cy="-32" r="40"/><circle cx="94" cy="-12" r="27"/>
      </g>
    </g>
    <g id="cumulus-c">
      <g fill="url(#dessous-nuage)">
        <circle cx="0" cy="0" r="30"/><circle cx="40" cy="-16" r="36"/><circle cx="84" cy="-26" r="44"/>
        <circle cx="134" cy="-6" r="34"/><circle cx="176" cy="6" r="24"/><rect x="-30" y="0" width="230" height="30" rx="15"/>
      </g>
      <g fill="#fff">
        <circle cx="-2" cy="-6" r="24"/><circle cx="38" cy="-24" r="30"/><circle cx="80" cy="-36" r="37"/>
        <circle cx="130" cy="-14" r="27"/><circle cx="172" cy="0" r="17"/>
      </g>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#ciel)"/>
  <rect width="1920" height="1080" fill="url(#halo)"/>

  <!-- Cirrus en haut du ciel -->
  <g fill="#fff" filter="url(#voile)">
    <g transform="rotate(-16 1200 160)">
      <ellipse cx="1180" cy="110" rx="280" ry="12" opacity=".5"/>
      <ellipse cx="1240" cy="132" rx="220" ry="8" opacity=".4"/>
      <ellipse cx="1130" cy="152" rx="240" ry="10" opacity=".45"/>
      <ellipse cx="1300" cy="178" rx="180" ry="7" opacity=".35"/>
      <ellipse cx="1080" cy="196" rx="150" ry="6" opacity=".3"/>
    </g>
    <g transform="rotate(6 260 170)">
      <ellipse cx="260" cy="160" rx="200" ry="8" opacity=".3"/>
      <ellipse cx="300" cy="178" rx="140" ry="6" opacity=".25"/>
    </g>
  </g>

  <!-- Cumulus, du plus loin (petits, bas) au plus proche -->
  <g filter="url(#coton)">
    <use href="#cumulus-c" transform="translate(1080 740) scale(.75)"/>
    <use href="#cumulus-a" transform="translate(1380 768) scale(.8 .7)"/>
    <use href="#cumulus-b" transform="translate(1700 770) scale(.9 .75)"/>
    <use href="#cumulus-c" transform="translate(620 700) scale(.6)"/>

    <use href="#cumulus-a" transform="translate(1250 560) scale(1.05)"/>
    <use href="#cumulus-b" transform="translate(1640 600) scale(1.2 1.1)"/>
    <use href="#cumulus-c" transform="translate(860 500) scale(1.1)"/>
    <use href="#cumulus-b" transform="translate(240 470) scale(.9)"/>

    <use href="#cumulus-a" transform="translate(1610 300) scale(1.15 1.05)"/>
    <use href="#cumulus-b" transform="translate(460 300) scale(.75)"/>
    <use href="#cumulus-c" transform="translate(130 640) scale(.55)"/>
  </g>

  <!-- Collines lointaines, bleutées, derrière la pente de droite -->
  <path d="M1400,818 C1460,800 1520,782 1580,786 C1610,772 1650,764 1690,772 C1730,758 1770,748 1810,756 C1850,750 1890,758 1940,770 L1940,900 L1400,900 Z" fill="url(#lointain)"/>

  <!-- La colline -->
  <g clip-path="url(#forme-colline)">
    <rect y="680" width="1920" height="400" fill="url(#colline)"/>
    <rect y="680" width="1920" height="400" fill="url(#lumiere)"/>
    <rect y="680" width="1920" height="400" fill="url(#ombre)"/>
    <!-- Ombres de nuages qui passent sur l'herbe -->
    <g fill="#1c5c06" filter="url(#flou-ombre)">
      <ellipse cx="420" cy="940" rx="300" ry="46" opacity=".35"/>
      <ellipse cx="1500" cy="1000" rx="260" ry="40" opacity=".3"/>
    </g>
    <rect y="680" width="1920" height="400" filter="url(#herbe)" opacity=".4"/>
    <!-- Liseré de lumière sur la crête -->
    <path d="M-20,772 C210,722 480,694 760,690 C1050,686 1340,738 1590,798 C1740,834 1850,856 1940,866" fill="none" stroke="#e6ff9a" stroke-width="5" stroke-opacity=".5"/>
  </g>
</svg>
