<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Image du compte utilisateur, comme sur l'écran d'ouverture de session
       de Windows 7 : une feuille et une goutte d'eau sur fond de ciel. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e74cf"/>
      <stop offset=".6" stop-color="#6cc4f2"/>
      <stop offset="1" stop-color="#d8f3ff"/>
    </linearGradient>
    <linearGradient id="feuille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4f26b"/>
      <stop offset=".5" stop-color="#5dbb2c"/>
      <stop offset="1" stop-color="#2a7a16"/>
    </linearGradient>
    <radialGradient id="goutte" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#d9f6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7fd7ff" stop-opacity=".25"/>
    </radialGradient>
    <linearGradient id="vernis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="cadre"><rect width="128" height="128" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#cadre)">
    <rect width="128" height="128" fill="url(#ciel)"/>
    <circle cx="98" cy="26" r="30" fill="#fff" opacity=".35"/>
    <circle cx="98" cy="26" r="12" fill="#fff" opacity=".7"/>
    <!-- Feuille -->
    <path d="M14,118 C20,64 58,30 116,24 C112,82 74,116 14,118 Z" fill="url(#feuille)"/>
    <path d="M14,118 C46,90 78,60 116,24" fill="none" stroke="#e9ffc2" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <path d="M44,90 C52,90 64,92 72,98 M60,72 C68,72 82,74 90,78 M76,54 C84,54 96,56 102,58 M44,90 C44,80 46,70 50,62 M60,72 C60,62 62,52 68,44" fill="none" stroke="#e9ffc2" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
    <!-- Goutte -->
    <ellipse cx="76" cy="84" rx="13" ry="12" fill="url(#goutte)" stroke="#fff" stroke-opacity=".7"/>
    <ellipse cx="71" cy="79" rx="4.5" ry="3" fill="#fff" opacity=".9" transform="rotate(-30 71 79)"/>
    <!-- Bulles -->
    <circle cx="30" cy="34" r="9" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
    <circle cx="27" cy="31" r="2.5" fill="#fff" opacity=".9"/>
    <circle cx="48" cy="18" r="5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
    <!-- Vernis brillant sur la moitié haute -->
    <path d="M0,0 H128 V54 C90,64 40,64 0,58 Z" fill="url(#vernis)"/>
  </g>
</svg>
