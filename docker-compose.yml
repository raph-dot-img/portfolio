services:
  portfolio:
    image: nginx:alpine
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Accès local uniquement. L'exposition publique passe par frpc.
      - "127.0.0.1:8080:80"
    volumes:
      # Configuration du serveur
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # En-têtes de sécurité partagés, hors de conf.d/ : nginx inclut tout
      # ce dossier dans le bloc http, où ces directives n'auraient pas cours.
      - ./nginx/securite.conf:/etc/nginx/securite.conf:ro
      # Fichiers du site, montés un par un pour ne rien exposer d'autre
      # (.env, ressources/ et serve.py restent en dehors du conteneur)
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./googlefcec097abc8fdb0a.html:/usr/share/nginx/html/googlefcec097abc8fdb0a.html:ro
      - ./confidentialite.html:/usr/share/nginx/html/confidentialite.html:ro
      - ./credits.html:/usr/share/nginx/html/credits.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./.well-known:/usr/share/nginx/html/.well-known:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./erreurs:/usr/share/nginx/html/erreurs:ro
      # Version anglaise, dossier entier : elle ne contient que des
      # fichiers destinés au site (pages + erreurs/)
      - ./en:/usr/share/nginx/html/en:ro
      # Journal d'accès persistant, hors de la racine web
      - ./logs:/var/log/portfolio

  frpc:
    image: snowdreamtech/frpc:latest
    container_name: portfolio-frpc
    restart: unless-stopped
    depends_on:
      - portfolio
    volumes:
      - ./frp/frpc.toml:/etc/frp/frpc.toml:ro
    environment:
      FRP_SERVER_ADDRESS: ${FRP_SERVER_ADDRESS:?FRP_SERVER_ADDRESS manquant dans .env}
      FRP_SERVER_BIND_PORT: ${FRP_SERVER_BIND_PORT:?FRP_SERVER_BIND_PORT manquant dans .env}
      FRP_SERVER_REMOTE_PORT: ${FRP_SERVER_REMOTE_PORT:?FRP_SERVER_REMOTE_PORT manquant dans .env}
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN manquant dans .env}
