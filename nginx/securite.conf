# En-têtes de sécurité communs à toutes les réponses.
#
# nginx n'hérite pas les « add_header » du bloc parent dès qu'un bloc enfant en
# définit un seul. Toute location qui ajoute son propre en-tête (cache, robots)
# perd donc silencieusement ceux du serveur : d'où ce fichier, inclus à la fois
# dans le bloc server et dans chacune de ces locations.
#
# Il est volontairement hors de conf.d/, dont nginx inclut tout le contenu
# directement dans le bloc http, où « add_header » n'aurait pas le même sens.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# Tout vient du même domaine, sauf l'envoi du formulaire vers Formspree
# (« connect-src » pour le fetch du script, « form-action » pour la soumission
# native si le JavaScript ne s'exécute pas).
add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
