# Inutile d'annoncer la version exacte de nginx dans chaque réponse.
server_tokens off;

# Copie du journal d'accès dans ./logs/ (monté depuis l'hôte), en plus de
# stdout : les logs de `docker logs` disparaissent à chaque recréation du
# conteneur, ce fichier-là survit. Même format « main » que nginx.conf.
access_log /var/log/portfolio/acces.log main;

# Le HTTPS est assuré par le serveur distant (devant FRP).
# Ce conteneur ne reçoit donc que du HTTP en clair, mais les redirections
# et les URL canoniques pointent bien vers https://

# Domaines secondaires : redirection permanente vers le domaine canonique.
# Sans cela, le même site existerait à trois adresses et les moteurs de
# recherche traiteraient les copies comme du contenu dupliqué.
server {
    listen 80;
    server_name raphael.canevet.eu contact.canevet.eu;
    return 301 https://canevet.eu$request_uri;
}

# Domaine canonique
server {
    listen 80 default_server;
    server_name canevet.eu _;

    root /usr/share/nginx/html;
    index index.html;

    # /en -> /en/ : nginx ne voit que du HTTP en clair, une redirection absolue
    # sortirait donc en http://. En relatif, le navigateur garde le https://
    # d'origine.
    absolute_redirect off;

    # Pages d'erreur personnalisées
    error_page 400 /erreurs/400.html;
    error_page 401 /erreurs/401.html;
    error_page 403 /erreurs/403.html;
    error_page 404 /erreurs/404.html;
    error_page 429 /erreurs/429.html;
    # Clin d'œil aux scanners : voir le bloc plus bas
    error_page 418 /erreurs/418.html;
    error_page 500 /erreurs/500.html;
    error_page 502 /erreurs/502.html;
    error_page 503 /erreurs/503.html;

    # Servies uniquement en interne, pas joignables directement
    location ^~ /erreurs/ {
        internal;
    }

    location ^~ /en/errors/ {
        internal;
    }

    # Même clin d'œil pour les scanners qui tapent dans /en/ (/en/.env,
    # /en/admin...) : 418 et le chat qui rigole, en anglais cette fois.
    location ~* ^/en/(?:admin|administrator|wp-admin|wp-login\.php|cpanel|panel|manage|management|backend|dashboard|\.env|config\.php|config\.json|wp-config\.php|\.git|\.aws|database\.yml|wp-content|wp-includes|xmlrpc\.php|joomla|drupal|typo3|laravel|phpinfo\.php|info\.php|server-status|server-info|debug|test\.php|actuator|phpmyadmin|pma|adminer\.php|dbadmin|\.ssh|backup\.(?:sql|zip)|\.htpasswd|\.htaccess|api|graphql|swagger)(?:[/.-]|$) {
        access_log off;
        add_header X-Robots-Tag "noindex" always;
        error_page 418 /en/errors/418.html;
        return 418;
    }

    # Chemins que seuls les scanners automatisés vont chercher (/admin, /.env,
    # /wp-login.php, /phpmyadmin...). Rien de tout cela n'existe ici, alors
    # plutôt qu'un 404 sec on leur sert un 418 et un chat qui rigole.
    # /.well-known/ reste volontairement en dehors : security.txt est légitime.
    location ~* ^/(?:admin|administrator|wp-admin|wp-login\.php|cpanel|panel|manage|management|backend|dashboard|\.env|config\.php|config\.json|wp-config\.php|\.git|\.aws|database\.yml|wp-content|wp-includes|xmlrpc\.php|joomla|drupal|typo3|laravel|phpinfo\.php|info\.php|server-status|server-info|debug|test\.php|actuator|phpmyadmin|pma|adminer\.php|dbadmin|\.ssh|backup\.(?:sql|zip)|\.htpasswd|\.htaccess|api|graphql|swagger)(?:[/.-]|$) {
        access_log off;
        add_header X-Robots-Tag "noindex" always;
        return 418;
    }

    # Version anglaise : mêmes pages d'erreur, dans sa propre langue.
    # Préfixe simple et non « ^~ », sinon nginx sauterait les blocs regex
    # ci-dessus et les scanners de /en/ n'auraient plus leur 418.
    location /en/ {
        error_page 400 /en/errors/400.html;
        error_page 401 /en/errors/401.html;
        error_page 403 /en/errors/403.html;
        error_page 404 /en/errors/404.html;
        error_page 429 /en/errors/429.html;
        error_page 418 /en/errors/418.html;
        error_page 500 /en/errors/500.html;
        error_page 502 /en/errors/502.html;
        error_page 503 /en/errors/503.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        access_log off;
    }

    # Le CV reste téléchargeable mais n'est pas indexé
    location = /assets/CANEVET_Raphael_CV.pdf {
        include /etc/nginx/securite.conf;
        add_header X-Robots-Tag "noindex" always;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|svg|png|pdf|woff2)$ {
        include /etc/nginx/securite.conf;
        expires 1h;
        add_header Cache-Control "public";
    }

    # En-têtes de sécurité de base
    include /etc/nginx/securite.conf;

    gzip on;
    # text/html est toujours compressé par nginx : le répéter déclenche un avertissement.
    gzip_types text/css application/javascript application/xml;
}
