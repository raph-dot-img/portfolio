# Inutile d'annoncer la version exacte de nginx dans chaque réponse.
server_tokens off;

# Copie du journal d'accès dans ./logs/ (monté depuis l'hôte), en plus de
# stdout : les logs de `docker logs` disparaissent à chaque recréation du
# conteneur, ce fichier-là survit. Même format « main » que nginx.conf.
access_log /var/log/portfolio/acces.log main;

# IP du visiteur, affichée par la page 418 (« Cet incident a été signalé »).
# $remote_addr vaut déjà l'IP transmise par frpc en PROXY protocol (voir
# real_ip_header plus bas). Si c'est une adresse privée ou locale, la
# connexion vient d'un relais (le reverse proxy HTTPS devant frps) : on prend
# alors la dernière entrée de X-Forwarded-For, celle que ce relais a ajoutée.
# Seuls les chiffres, lettres a-f, « . » et « : » passent, donc rien de ce
# qui arrive dans cet en-tête ne peut injecter du HTML dans la page.
map $http_x_forwarded_for $ip_transmise {
    "~(?:^|,)\s*(?<derniere>[0-9A-Fa-f:.]{3,45})\s*$" $derniere;
    default "";
}

map "$remote_addr $ip_transmise" $ip_visiteur {
    "~^(?:127\.|10\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.|::1 |f[cd])\S* (?<relayee>\S+)$" $relayee;
    "~^(?<directe>\S+)" $directe;
}

# Le HTTPS est assuré par le serveur distant (devant FRP).
# Ce conteneur ne reçoit donc que du HTTP en clair, mais les redirections
# et les URL canoniques pointent bien vers https://

# Domaines secondaires : redirection permanente vers le domaine canonique.
# Sans cela, le même site existerait à trois adresses et les moteurs de
# recherche traiteraient les copies comme du contenu dupliqué.
server {
    listen 80;
    server_name raphael.canevet.eu contact.canevet.eu;
    return 301 https://canevet.eu$request_uri;
}

# Domaine canonique
server {
    listen 80 default_server;
    # Port réservé à frpc, qui y préfixe chaque connexion d'un en-tête PROXY
    # protocol portant la vraie IP du visiteur. Sans lui, nginx ne verrait que
    # l'adresse du conteneur frpc. Pas publié sur l'hôte : le 8080 local reste
    # sur le port 80, en HTTP normal.
    listen 81 proxy_protocol;
    server_name canevet.eu _;

    # Seul frpc, sur le réseau Docker, peut parler au port 81. Sur le port 80
    # il n'y a pas d'en-tête PROXY et $remote_addr reste inchangé.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header proxy_protocol;

    root /usr/share/nginx/html;
    index index.html;

    # /en -> /en/ : nginx ne voit que du HTTP en clair, une redirection absolue
    # sortirait donc en http://. En relatif, le navigateur garde le https://
    # d'origine.
    absolute_redirect off;

    # Pages d'erreur personnalisées
    error_page 400 /erreurs/400.html;
    error_page 401 /erreurs/401.html;
    error_page 403 /erreurs/403.html;
    error_page 404 /erreurs/404.html;
    error_page 429 /erreurs/429.html;
    # Clin d'œil aux scanners : voir le bloc plus bas
    error_page 418 /erreurs/418.html;
    error_page 500 /erreurs/500.html;
    error_page 502 /erreurs/502.html;
    error_page 503 /erreurs/503.html;

    # Servies uniquement en interne, pas joignables directement
    location ^~ /erreurs/ {
        internal;
    }

    location ^~ /en/errors/ {
        internal;
    }

    # Les pages 418 affichent l'IP du visiteur à la place de IP_DU_CLIENT.
    # Pur bluff : rien n'est signalé nulle part. La page change d'un visiteur
    # à l'autre, elle ne doit donc pas être mise en cache.
    location = /erreurs/418.html {
        internal;
        include /etc/nginx/securite.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        sub_filter "IP_DU_CLIENT" "$ip_visiteur";
    }

    location = /en/errors/418.html {
        internal;
        include /etc/nginx/securite.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        sub_filter "IP_DU_CLIENT" "$ip_visiteur";
    }

    # Même clin d'œil pour les scanners qui tapent dans /en/ (/en/.env,
    # /en/admin...) : 418 et le chat qui rigole, en anglais cette fois.
    location ~* ^/en/(?:admin|administrator|cpanel|panel|manage|management|manager|backend|dashboard|console|login|setup|install|wp|wordpress|joomla|drupal|typo3|laravel|telescope|_profiler|_ignition|vendor|cgi-bin|boaform|hnap1|owa|ecp|autodiscover|jenkins|solr|actuator|server-status|server-info|debug|phpmyadmin|myadmin|pma|mysql|sql|db|dbadmin|dump|backups?|shell|api|graphql|swagger|\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.docker|\.vscode|\.idea|\.ds_store|\.npmrc|\.bash_history|\.htpasswd|\.htaccess|id_rsa|id_ed25519|web\.config|config\.(?:json|ya?ml)|database\.yml|docker-compose\.ya?ml|secrets?|credentials|elmah\.axd|trace\.axd|(?:[^/]+/)*[^/]*\.(?:php\d?|phtml|aspx?|jsp|cgi))(?:[/.-]|$) {
        access_log off;
        add_header X-Robots-Tag "noindex" always;
        error_page 418 /en/errors/418.html;
        return 418;
    }

    # Chemins que seuls les scanners automatisés vont chercher (/admin, /.env,
    # /wp-login.php, /phpmyadmin...). Rien de tout cela n'existe ici, alors
    # plutôt qu'un 404 sec on leur sert un 418 et un chat qui rigole.
    # « wp » couvre tous les wp-*, et la dernière entrée attrape n'importe quel
    # .php, .asp(x), .jsp ou .cgi, à n'importe quelle profondeur : le site n'en
    # a aucun. Liste à garder identique au bloc /en/ et à serve.py.
    # /.well-known/ reste volontairement en dehors : security.txt est légitime.
    location ~* ^/(?:admin|administrator|cpanel|panel|manage|management|manager|backend|dashboard|console|login|setup|install|wp|wordpress|joomla|drupal|typo3|laravel|telescope|_profiler|_ignition|vendor|cgi-bin|boaform|hnap1|owa|ecp|autodiscover|jenkins|solr|actuator|server-status|server-info|debug|phpmyadmin|myadmin|pma|mysql|sql|db|dbadmin|dump|backups?|shell|api|graphql|swagger|\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.docker|\.vscode|\.idea|\.ds_store|\.npmrc|\.bash_history|\.htpasswd|\.htaccess|id_rsa|id_ed25519|web\.config|config\.(?:json|ya?ml)|database\.yml|docker-compose\.ya?ml|secrets?|credentials|elmah\.axd|trace\.axd|(?:[^/]+/)*[^/]*\.(?:php\d?|phtml|aspx?|jsp|cgi))(?:[/.-]|$) {
        access_log off;
        add_header X-Robots-Tag "noindex" always;
        return 418;
    }

    # Version anglaise : mêmes pages d'erreur, dans sa propre langue.
    # Préfixe simple et non « ^~ », sinon nginx sauterait les blocs regex
    # ci-dessus et les scanners de /en/ n'auraient plus leur 418.
    location /en/ {
        error_page 400 /en/errors/400.html;
        error_page 401 /en/errors/401.html;
        error_page 403 /en/errors/403.html;
        error_page 404 /en/errors/404.html;
        error_page 429 /en/errors/429.html;
        error_page 418 /en/errors/418.html;
        error_page 500 /en/errors/500.html;
        error_page 502 /en/errors/502.html;
        error_page 503 /en/errors/503.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        access_log off;
    }

    # Le CV reste téléchargeable mais n'est pas indexé
    location = /assets/CANEVET_Raphael_CV.pdf {
        include /etc/nginx/securite.conf;
        add_header X-Robots-Tag "noindex" always;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|svg|png|pdf|woff2)$ {
        include /etc/nginx/securite.conf;
        expires 1h;
        add_header Cache-Control "public";
    }

    # En-têtes de sécurité de base
    include /etc/nginx/securite.conf;

    gzip on;
    # text/html est toujours compressé par nginx : le répéter déclenche un avertissement.
    gzip_types text/css application/javascript application/xml;
}
